    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // The tab icon and the browser's toolbar colour follow the site theme.
      (function () {
        var root = document.documentElement;
        var sync = function () {
          var t = root.dataset.theme === 'light' ? 'light' : 'dark';
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.href = icon.href.replace(/favicon-(dark|light)\.svg/, 'favicon-' + t + '.svg');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = t === 'light' ? '#efe9dd' : '#0c0e0d';
        };
        sync();
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
      })();
    </script>
